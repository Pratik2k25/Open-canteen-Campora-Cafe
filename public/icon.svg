<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2229"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7547"/>
      <stop offset="100%" stop-color="#FF4820"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF5C38" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FF5C38" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Campora Brand Motif: Modern Coffee Cup + Dining Cloche / Glow -->
  <g filter="url(#glow)" transform="translate(96, 100)">
    <!-- Steam waves -->
    <path d="M100,50 Q115,25 100,0 Q85,-25 100,-50" fill="none" stroke="url(#coralGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M160,40 Q175,15 160,-10 Q145,-35 160,-60" fill="none" stroke="url(#coralGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M220,50 Q235,25 220,0 Q205,-25 220,-50" fill="none" stroke="url(#coralGrad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Cup Body -->
    <path d="M40,90 L280,90 C280,210 240,250 160,250 C80,250 40,210 40,90 Z" fill="url(#coralGrad)"/>
    
    <!-- Cup Handle -->
    <path d="M270,110 C320,110 330,190 260,200" fill="none" stroke="url(#coralGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Saucer / Plate -->
    <path d="M10,270 L310,270 C310,285 290,295 160,295 C30,295 10,285 10,270 Z" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Fork & Spoon Accent inside cup -->
    <circle cx="160" cy="160" r="32" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="160" y="172" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle">C</text>
  </g>

  <!-- Typography Brand at Bottom -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">CAMPORA</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="18" fill="#FF7547" letter-spacing="8" text-anchor="middle">CAFÉ</text>
</svg>
